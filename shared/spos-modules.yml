modules:
  - type: dnf
    install:
      packages:
        - jq

  - type: systemd
    system:
      enabled:
        - podman-restart.service

  - type: files
    files:
      - source: single-purpose-os-registries.yaml
        destination: /etc/containers/registries.d/single-purpose-os.yaml
      - source: single-purpose-os-cosign.pub
        destination: /usr/share/pki/containers/single-purpose-os.pub

  - type: script
    snippets:
      - |
        set -euo pipefail
        policy=/etc/containers/policy.json
        test -s "$policy"
        temporary_policy=$(mktemp /etc/containers/policy.json.XXXXXX)
        trap 'rm -f "$temporary_policy"' EXIT
        jq '.transports.docker["ghcr.io/bryanconradhart"] = [{
          "type": "sigstoreSigned",
          "keyPath": "/usr/share/pki/containers/single-purpose-os.pub",
          "signedIdentity": {"type": "matchRepository"}
        }]' "$policy" > "$temporary_policy"
        chmod 0644 "$temporary_policy"
        mv "$temporary_policy" "$policy"
        trap - EXIT
