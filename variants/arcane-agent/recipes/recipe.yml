name: single-purpose-os-arcane-agent
description: Single-purpose bootc image for homelabs with the Arcane Agent
base-image: ghcr.io/ublue-os/ucore
image-version: stable

modules:
  - from-file: ../../../shared/spos-modules.yml

  - type: files
    files:
      - source: arcane-agent-enroll.sh
        destination: /usr/libexec/arcane-agent-enroll.sh
      - source: 90-arcane-agent-setup-notice.sh
        destination: /etc/profile.d/90-arcane-agent-setup-notice.sh
      - source: arcane-agent.container
        destination: /usr/share/containers/systemd/arcane-agent.container

  - type: script
    snippets:
      - chmod 0755 /usr/libexec/arcane-agent-enroll.sh

  - type: systemd
    system:
      enabled:
        - podman.socket
        - podman-auto-update.timer
