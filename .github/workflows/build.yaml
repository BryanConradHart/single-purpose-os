name: Build and Publish Single-Purpose Images

on:
  schedule:
    - cron: '0 0 * * 1' # Rebuilds automatically every Monday at midnight to pull upstream security fixes
  push:
    branches:
      - main # Triggers a fresh build whenever you push or merge to main
  workflow_dispatch: # Adds a Run Workflow button in GitHub UI

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tag:
    name: Compute shared image tag
    runs-on: ubuntu-latest
    steps:
      - name: Compute build tag
        id: meta
        shell: bash
        run: |
          echo "tag=v$(date -u +%Y.%m.%d-%H%M%S)-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  build-and-publish:
    name: Build and Publish ${{ matrix.variant }} image
    needs: build-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            image: single-purpose-os-base
          - variant: arcane-manager
            image: single-purpose-os-arcane-manager
          - variant: arcane-agent
            image: single-purpose-os-arcane-agent
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare shared files
        run: ./scripts/prepare-variant-files.sh "${{ matrix.variant }}"

      - name: Build and Publish Container Image
        uses: blue-build/github-action@v1
        with:
          recipe: 'recipe.yml'
          working_directory: ./variants/${{ matrix.variant }}
          registry: ghcr.io
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: ${{ github.event.number }}
          push: true
          skip_checkout: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cosign v3 breaking change hack
      - name: Install Cosign v2
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: 'v2.6.5'
          install-dir: '/usr/local/bin'
          use-sudo: 'true'
          
      - name: Publish a versioned image tag
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ needs.build-tag.outputs.tag }}
          # remove cosign env vars after cosign v3 issue is fixed
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          docker pull "${IMAGE}:latest"

          # temporary for cosign v3 breaking change
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:latest" | cut -d'@' -f2)
          # Sign the top-level index digest cleanly
          cosign clean --force "${IMAGE}@${DIGEST}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

          # Clean and sign each platform manifest directly so docker-manifest-digest matches each platform
          for CHILD_DIGEST in $(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}" | jq -r '.manifests[]?.digest // empty'); do
            cosign clean --force "${IMAGE}@${CHILD_DIGEST}"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${CHILD_DIGEST}"
          done
          # end temporary section

          docker tag "${IMAGE}:latest" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"
          cosign verify --key cosign.pub "${IMAGE}:latest" >/dev/null
          cosign verify --key cosign.pub "${IMAGE}:${IMAGE_TAG}" >/dev/null

  notify-downstream:
    name: Trigger downstream builds
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Get App token for strix-halo-server
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.STRIX_DISPATCH_APP_ID }}
          private-key: ${{ secrets.STRIX_DISPATCH_APP_KEY }}
          installation-id: ${{ secrets.STRIX_DISPATCH_INSTALLATION_ID }}
          repositories: strix-halo-server

      - name: Dispatch strix-halo-server build
        uses: actions/github-script@v7
        with:
          # The built-in GITHUB_TOKEN cannot trigger workflows in another
          # repository, so we dispatch as the cross-repo App. Per GitHub's
          # REST docs, createDispatchEvent requires "Contents: read and
          # write" on the App's installation token.
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'strix-halo-server',
              event_type: 'spos-images-published',
              client_payload: { tag: '${{ needs.build-tag.outputs.tag }}' },
            });
